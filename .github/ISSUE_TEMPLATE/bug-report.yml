name: Product bug
description: Report a reproducible problem in the Scroll Games platform.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private data, or vulnerability details. Use the private security contact for those reports.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: iPhone 15 / iOS 18 / Safari, or macOS / Chrome 140
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add non-sensitive logs, screenshots, or links that help reproduce the issue.
